<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lunchboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f2f3f6;
      --surface:  #ffffff;
      --surface2: #f7f8fa;
      --border:   #e3e6eb;
      --text:     #111318;
      --muted:    #8a8f9e;
      --green:       #16a34a;
      --green-bg:    #f0fdf4;
      --green-bd:    #bbf7d0;
      --red:         #dc2626;
      --red-bg:      #fef2f2;
      --red-bd:      #fecaca;
      --indigo:      #6366f1;
      --indigo-bg:   #eef2ff;
      --indigo-bd:   #c7d2fe;
      --match:       #f43f8e;
      --match-bg:    #fff0f6;
      --match-bd:    #fbc8df;
      --r:    14px;
      --rsm:  10px;
      --pill: 999px;
      --sh:   0 1px 3px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.05);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ── */
    .hdr {
      position: sticky; top: 0; z-index: 100;
      background: rgba(242,243,246,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg,#6366f1,#8b5cf6);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; box-shadow: 0 3px 10px rgba(99,102,241,.3);
    }
    .brand-name { font-size: 1rem; font-weight: 800; letter-spacing: -.02em; }
    .brand-date { font-size: .7rem; color: var(--muted); font-weight: 500; margin-top: 1px; }
    .gear-btn {
      width: 44px; height: 44px; border-radius: var(--rsm);
      border: 1px solid var(--border); background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; cursor: pointer; box-shadow: var(--sh);
      -webkit-tap-highlight-color: transparent; flex-shrink: 0;
    }

    /* ── MAIN GRID ── */
    .main {
      padding: 14px 12px;
      display: flex; flex-direction: column; gap: 14px;
      max-width: 900px; margin: 0 auto;
    }
    @media (min-width: 680px) {
      .main { display: grid; grid-template-columns: 1fr 1fr; padding: 20px 24px; }
    }

    /* ── SECTION CARD ── */
    .sc {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      box-shadow: var(--sh);
      overflow: hidden;
      transition: border-color .3s, box-shadow .3s;
    }
    .sc.matched {
      border-color: var(--match-bd);
      box-shadow: var(--sh), 0 0 0 3px rgba(244,63,142,.1);
    }

    .sc-top {
      padding: 14px 16px 8px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .sc-lbl { display: flex; align-items: center; gap: 7px; }
    .sc-emoji { font-size: 1.2rem; }
    .sc-title { font-size: 1rem; font-weight: 800; letter-spacing: -.01em; }

    .cpill {
      font-size: .68rem; font-weight: 700;
      padding: 3px 10px; border-radius: var(--pill);
      border: 1px solid var(--border); color: var(--muted); background: var(--surface2);
      transition: all .2s;
    }
    .cpill.on { background: var(--green-bg); border-color: var(--green-bd); color: var(--green); }

    /* match banner */
    .mbanner {
      display: none; align-items: center; gap: 8px;
      margin: 0 14px 8px;
      padding: 9px 13px;
      border-radius: var(--rsm);
      background: var(--match-bg); border: 1px solid var(--match-bd);
      font-size: .8rem; font-weight: 700; color: var(--match);
    }
    .mbanner.show { display: flex; animation: slin .35s cubic-bezier(.34,1.56,.64,1); }
    .mhearts span { display: inline-block; animation: hb .9s ease-in-out infinite; }
    .mhearts span:nth-child(2) { animation-delay: .15s; }
    .mhearts span:nth-child(3) { animation-delay: .30s; }
    @keyframes hb   { 0%,100%{transform:scale(1)} 30%{transform:scale(1.4)} }
    @keyframes slin { from{opacity:0;transform:translateY(-4px) scale(.96)} to{opacity:1;transform:none} }

    .tend {
      padding: 0 16px 8px;
      font-size: .73rem; font-weight: 600; color: var(--muted); min-height: 1.3em;
    }
    .tend.on { color: var(--indigo); }

    /* ── USERS ── */
    .users { padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }

    .ublock {
      border-radius: var(--rsm);
      border: 1px solid var(--border);
      background: var(--surface2);
      overflow: hidden;
      transition: border-color .18s, background .18s;
    }
    .ublock.is-in  { background: var(--green-bg); border-color: var(--green-bd); }
    .ublock.is-out { background: var(--red-bg);   border-color: var(--red-bd); }

    .umain {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 10px; min-height: 58px;
    }
    .sdot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--border); flex-shrink: 0;
      transition: background .18s, box-shadow .18s;
    }
    .is-in  .sdot { background: var(--green); box-shadow: 0 0 6px rgba(22,163,74,.5); }
    .is-out .sdot { background: var(--red);   box-shadow: 0 0 6px rgba(220,38,38,.4); }

    .av {
      width: 34px; height: 34px; border-radius: 8px;
      font-size: .85rem; font-weight: 800; color: #fff;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .uname { font-size: .9rem; font-weight: 700; flex: 1; min-width: 0; }

    /* BIG TAP BUTTONS */
    .tapbtns { display: flex; gap: 6px; flex-shrink: 0; }
    .tbtn {
      font-family: 'Inter', sans-serif;
      font-size: .78rem; font-weight: 800;
      min-height: 46px; min-width: 70px;
      padding: 0 12px; border-radius: var(--rsm);
      border: 1.5px solid var(--border);
      background: var(--surface); cursor: pointer; color: var(--muted);
      transition: all .14s;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .tbtn.yes:hover  { background: var(--green-bg); border-color: var(--green-bd); color: var(--green); }
    .tbtn.yes.active { background: var(--green);    border-color: var(--green);    color: #fff; box-shadow: 0 2px 8px rgba(22,163,74,.3); }
    .tbtn.no:hover   { background: var(--red-bg);   border-color: var(--red-bd);   color: var(--red); }
    .tbtn.no.active  { background: var(--red);      border-color: var(--red);      color: #fff; box-shadow: 0 2px 8px rgba(220,38,38,.25); }

    /* time chips */
    .trow {
      padding: 0 10px 10px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    }
    .trow-lbl {
      font-size: .62rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    }
    .tc {
      font-family: 'Inter', sans-serif;
      font-size: .74rem; font-weight: 600;
      padding: 6px 11px; border-radius: var(--pill);
      border: 1px solid var(--border); background: var(--surface); color: var(--muted);
      cursor: pointer; transition: all .13s; min-height: 34px;
      -webkit-tap-highlight-color: transparent;
    }
    .tc:hover { border-color: var(--indigo-bd); color: var(--indigo); background: var(--indigo-bg); }
    .tc.sel   { background: var(--indigo); border-color: var(--indigo); color: #fff; }
    .tc.msel  { background: var(--match);  border-color: var(--match);  color: #fff; box-shadow: 0 0 0 3px rgba(244,63,142,.18); }

    /* note */
    .note-wrap {
      margin: 10px 12px 14px;
      border-radius: var(--rsm); border: 1px solid var(--border);
      background: var(--surface2); overflow: hidden;
    }
    .note-hd {
      padding: 7px 12px;
      font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); border-bottom: 1px solid var(--border);
    }
    .note-ta {
      width: 100%; border: none; outline: none; background: transparent;
      font-family: 'Inter', sans-serif; font-size: .85rem; color: var(--text);
      padding: 10px 12px; resize: none; min-height: 50px; line-height: 1.5;
    }
    .note-ta::placeholder { color: var(--muted); }
    .sc-pad { height: 14px; }

    /* ── FOOTER ── */
    .foot {
      padding: 12px 16px 24px; max-width: 900px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; }
    .leg { display: flex; align-items: center; gap: 6px; font-size: .75rem; font-weight: 500; color: var(--muted); }
    .ldot { width: 8px; height: 8px; border-radius: 50%; }
    .ldot.g { background: var(--green); }
    .ldot.r { background: var(--red); }
    .ldot.n { background: var(--border); }
    .reset-btn {
      font-family: 'Inter', sans-serif; font-size: .78rem; font-weight: 700;
      padding: 10px 18px; border-radius: var(--pill);
      border: 1px solid var(--border); background: var(--surface); color: var(--muted);
      cursor: pointer; box-shadow: var(--sh); min-height: 42px;
    }
    .reset-btn:hover { border-color: #bec3cc; color: var(--text); }

    /* ── DRAWER ── */
    .overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.35); backdrop-filter: blur(2px); }
    .overlay.open { display: block; }
    .drawer {
      position: fixed; right: 0; top: 0; bottom: 0; z-index: 201;
      width: min(420px,100vw); background: var(--surface);
      box-shadow: -8px 0 40px rgba(0,0,0,.12);
      display: flex; flex-direction: column;
      transform: translateX(100%);
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }
    .drawer.open { transform: translateX(0); }
    .drw-hdr {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .drw-title { font-size: 1rem; font-weight: 800; }
    .drw-close {
      width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; cursor: pointer; color: var(--muted);
    }
    .drw-body { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 22px; }

    .dsec { display: flex; flex-direction: column; gap: 10px; }
    .dsec-title {
      font-size: .65rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted);
      padding-bottom: 6px; border-bottom: 1px solid var(--border);
    }
    .surow {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: var(--surface2);
      border: 1px solid var(--border); border-radius: var(--rsm);
    }
    .suname { flex: 1; font-size: .88rem; font-weight: 600; }
    .del-btn {
      font-family: 'Inter', sans-serif; font-size: .72rem; font-weight: 700;
      padding: 5px 12px; border-radius: var(--pill);
      border: 1px solid var(--red-bd); background: var(--red-bg); color: var(--red);
      cursor: pointer;
    }
    .del-btn:hover { background: var(--red); color: #fff; }

    .add-row { display: flex; gap: 8px; }
    .add-inp {
      flex: 1; font-family: 'Inter', sans-serif; font-size: .88rem; font-weight: 500;
      padding: 11px 14px; border-radius: var(--rsm);
      border: 1.5px solid var(--border); background: var(--surface2); color: var(--text);
      outline: none; min-height: 48px;
    }
    .add-inp:focus { border-color: var(--indigo); }
    .add-inp::placeholder { color: var(--muted); }
    .add-btn {
      font-family: 'Inter', sans-serif; font-size: .82rem; font-weight: 800;
      padding: 0 18px; min-height: 48px; border-radius: var(--rsm);
      border: none; background: var(--indigo); color: #fff; cursor: pointer; white-space: nowrap;
    }

    .bset { display: flex; flex-direction: column; gap: 8px; }
    .bset-lbl { font-size: .84rem; font-weight: 700; display: flex; align-items: center; gap: 5px; }
    .bset-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .bset-sub { font-size: .72rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
    .tsel {
      font-family: 'Inter', sans-serif; font-size: .82rem; font-weight: 600;
      padding: 8px 10px; border-radius: var(--rsm);
      border: 1.5px solid var(--border); background: var(--surface2); color: var(--text);
      cursor: pointer; outline: none; min-height: 40px;
    }
    .tsel:focus { border-color: var(--indigo); }

    /* confetti */
    .cfwrap { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 999; }
    .cf { position: absolute; opacity: 0; animation: cff 1.5s ease-out forwards; }
    @keyframes cff { 0%{opacity:1;transform:translateY(-10px) rotate(0)} 100%{opacity:0;transform:translateY(240px) rotate(420deg)} }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="brand">
    <div class="brand-icon">🍽</div>
    <div>
      <div class="brand-name">Lunchboard</div>
      <div class="brand-date" id="hdr-date"></div>
    </div>
  </div>
  <button class="gear-btn" onclick="openSettings()">⚙️</button>
</header>

<!-- MAIN — static structure, JS fills content -->
<main class="main">

  <!-- FRÜHSTÜCK -->
  <div class="sc" id="sc-breakfast">
    <div class="sc-top">
      <div class="sc-lbl">
        <span class="sc-emoji">🥐</span>
        <span class="sc-title">Frühstück</span>
      </div>
      <span class="cpill" id="pill-breakfast">0 dabei</span>
    </div>
    <div class="mbanner" id="banner-breakfast">
      <div class="mhearts"><span>🧡</span><span>🧡</span><span>🧡</span></div>
      <span class="mtxt" id="mtxt-breakfast"></span>
    </div>
    <div class="tend" id="tend-breakfast">Noch keine Zeitangabe</div>
    <div class="users" id="users-breakfast"></div>
    <div class="sc-pad"></div>
  </div>

  <!-- MITTAGESSEN -->
  <div class="sc" id="sc-lunch">
    <div class="sc-top">
      <div class="sc-lbl">
        <span class="sc-emoji">🍜</span>
        <span class="sc-title">Mittagessen</span>
      </div>
      <span class="cpill" id="pill-lunch">0 dabei</span>
    </div>
    <div class="mbanner" id="banner-lunch">
      <div class="mhearts"><span>❤️</span><span>❤️</span><span>❤️</span></div>
      <span class="mtxt" id="mtxt-lunch"></span>
    </div>
    <div class="tend" id="tend-lunch">Noch keine Zeitangabe</div>
    <div class="users" id="users-lunch"></div>
    <div class="note-wrap">
      <div class="note-hd">🍽 Essenswünsche</div>
      <textarea class="note-ta" id="lunch-note" placeholder="z.B. Sushi, Pizza, Thai …" rows="2" oninput="saveNote()"></textarea>
    </div>
  </div>

</main>

<!-- FOOTER -->
<footer class="foot">
  <div class="legend">
    <div class="leg"><span class="ldot g"></span><span id="sum-g">0 dabei</span></div>
    <div class="leg"><span class="ldot r"></span><span id="sum-r">0 nein</span></div>
    <div class="leg"><span class="ldot n"></span><span id="sum-n">0 offen</span></div>
  </div>
  <button class="reset-btn" onclick="resetDay()">Tag zurücksetzen</button>
</footer>

<!-- SETTINGS DRAWER -->
<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<aside class="drawer" id="drawer">
  <div class="drw-hdr">
    <span class="drw-title">⚙️ Einstellungen</span>
    <button class="drw-close" onclick="closeSettings()">✕</button>
  </div>
  <div class="drw-body" id="drw-body"></div>
</aside>

<div class="cfwrap" id="cfwrap"></div>

<script>
/* ══════════════════════════════════════════
   DEFAULTS
══════════════════════════════════════════ */
const SK = 'lb7';

const BREAKS = ['breakfast','lunch'];

let cfg = {
  users: [
    { id:'daniel', name:'Daniel', color:'#6366f1' },
    { id:'lisa',   name:'Lisa',   color:'#f59e0b' },
  ],
  breaks: {
    breakfast: { sh:9,  sm:0, eh:10, em:30, def:'09:30' },
    lunch:     { sh:12, sm:0, eh:14, em:0,  def:'12:30' },
  },
};

let day = {};
let prevMatch = { breakfast:false, lunch:false };

/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function slots(sh,sm,eh,em){
  const out=[]; let h=sh,m=sm;
  while(h<eh||(h===eh&&m<=em)){
    out.push(p2(h)+':'+p2(m));
    m+=15; if(m>=60){m-=60;h++;}
  }
  return out;
}
function p2(n){ return String(n).padStart(2,'0'); }
function today(){ return new Date().toISOString().slice(0,10); }

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
function loadAll(){
  try{ const r=localStorage.getItem(SK+'_cfg'); if(r) cfg=JSON.parse(r); }catch(e){}
  try{
    const r=localStorage.getItem(SK+'_day');
    if(r){ const s=JSON.parse(r); if(s.date===today()){ day=s; return; } }
  }catch(e){}
  freshDay();
}

function freshDay(){
  day={ date:today(), st:{}, ti:{}, note:'' };
  BREAKS.forEach(b=>{
    day.st[b]={}; day.ti[b]={};
    cfg.users.forEach(u=>{
      day.st[b][u.id]=null;
      day.ti[b][u.id]=cfg.breaks[b].def;
    });
  });
  saveDay();
}

function reconcile(){
  BREAKS.forEach(b=>{
    if(!day.st[b]) day.st[b]={};
    if(!day.ti[b]) day.ti[b]={};
    cfg.users.forEach(u=>{
      if(day.st[b][u.id]===undefined) day.st[b][u.id]=null;
      if(!day.ti[b][u.id]) day.ti[b][u.id]=cfg.breaks[b].def;
    });
  });
}

function saveCfg(){ try{ localStorage.setItem(SK+'_cfg',JSON.stringify(cfg)); }catch(e){} }
function saveDay(){ try{ localStorage.setItem(SK+'_day',JSON.stringify(day)); }catch(e){} }

/* ══════════════════════════════════════════
   ACTIONS
══════════════════════════════════════════ */
function setStatus(brk,uid,val){
  day.st[brk][uid] = day.st[brk][uid]===val ? null : val;
  saveDay(); renderSection(brk); renderSummary();
}

function setTime(brk,uid,t){
  day.ti[brk][uid] = day.ti[brk][uid]===t ? cfg.breaks[brk].def : t;
  saveDay(); renderSection(brk);
}

function saveNote(){
  day.note = document.getElementById('lunch-note').value;
  saveDay();
}

function resetDay(){
  if(!confirm('Tag wirklich zurücksetzen?')) return;
  prevMatch={breakfast:false,lunch:false};
  freshDay(); renderAll();
}

/* ══════════════════════════════════════════
   MATCH
══════════════════════════════════════════ */
function matchInfo(brk){
  const att = cfg.users.filter(u=>day.st[brk][u.id]===true);
  if(att.length<2) return {ok:false,time:null,att};
  const times = att.map(u=>day.ti[brk][u.id]);
  return {ok:times.every(t=>t===times[0]), time:times[0], att};
}

function confetti(cardEl){
  const rect=cardEl.getBoundingClientRect();
  const wrap=document.getElementById('cfwrap');
  const cols=['#f43f8e','#6366f1','#f59e0b','#22c55e','#06b6d4','#a855f7','#fbbf24'];
  wrap.innerHTML='';
  for(let i=0;i<32;i++){
    const el=document.createElement('div');
    el.className='cf';
    const sz=6+Math.random()*7;
    el.style.cssText=`background:${cols[i%cols.length]};left:${rect.left+Math.random()*rect.width}px;top:${rect.top+Math.random()*rect.height*.5}px;width:${sz}px;height:${sz}px;border-radius:${Math.random()>.5?'50%':'3px'};animation-delay:${Math.random()*.5}s;animation-duration:${1.2+Math.random()*.8}s`;
    wrap.appendChild(el);
  }
  setTimeout(()=>{wrap.innerHTML='';},2600);
}

/* ══════════════════════════════════════════
   RENDER SECTION
══════════════════════════════════════════ */
function renderSection(brk){
  const bc  = cfg.breaks[brk];
  const sl  = slots(bc.sh, bc.sm, bc.eh, bc.em);
  const mi  = matchInfo(brk);
  const was = prevMatch[brk];

  /* card glow */
  document.getElementById('sc-'+brk).className = 'sc'+(mi.ok?' matched':'');

  /* count pill */
  const pill = document.getElementById('pill-'+brk);
  pill.textContent = mi.att.length+' dabei';
  pill.className   = 'cpill'+(mi.att.length>0?' on':'');

  /* match banner */
  const banner = document.getElementById('banner-'+brk);
  const mtxt   = document.getElementById('mtxt-'+brk);
  if(mi.ok){
    banner.classList.add('show');
    mtxt.textContent = 'Alle um '+mi.time+' – perfekter Match! 🎉';
    if(!was) confetti(document.getElementById('sc-'+brk));
  } else {
    banner.classList.remove('show');
  }
  prevMatch[brk] = mi.ok;

  /* tendency */
  const tend = document.getElementById('tend-'+brk);
  if(mi.ok){
    tend.textContent=''; tend.className='tend';
  } else if(mi.att.length===0){
    tend.textContent='Noch keine Zeitangabe'; tend.className='tend';
  } else {
    const freq={};
    mi.att.forEach(u=>{ const t=day.ti[brk][u.id]; freq[t]=(freq[t]||0)+1; });
    const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
    tend.textContent='→ Tendenz: '+top[0]+' Uhr'; tend.className='tend on';
  }

  /* users */
  const usersEl = document.getElementById('users-'+brk);
  usersEl.innerHTML = '';

  cfg.users.forEach(function(u){
    const s  = day.st[brk][u.id];
    const ut = day.ti[brk][u.id] || bc.def;

    const chips = sl.map(function(t){
      const isSel = ut===t;
      const isMat = isSel && mi.ok && s===true;
      return '<button class="tc'+(isSel?' sel':'')+(isMat?' msel':'')+'" onclick="setTime(\''+brk+'\',\''+u.id+'\',\''+t+'\')">'+t+'</button>';
    }).join('');

    const lbl = brk==='breakfast' ? 'Frühstück' : 'Mittag';
    const div = document.createElement('div');
    div.className = 'ublock'+(s===true?' is-in':s===false?' is-out':'');
    div.innerHTML =
      '<div class="umain">'+
        '<div class="sdot"></div>'+
        '<div class="av" style="background:'+u.color+'">'+u.name[0].toUpperCase()+'</div>'+
        '<span class="uname">'+u.name+'</span>'+
        '<div class="tapbtns">'+
          '<button class="tbtn yes'+(s===true?' active':'')+'" onclick="setStatus(\''+brk+'\',\''+u.id+'\',true)">✓ Dabei</button>'+
          '<button class="tbtn no'+(s===false?' active':'')+'" onclick="setStatus(\''+brk+'\',\''+u.id+'\',false)">✕ Nein</button>'+
        '</div>'+
      '</div>'+
      '<div class="trow">'+
        '<span class="trow-lbl">Zeit</span>'+
        chips+
      '</div>';
    usersEl.appendChild(div);
  });
}

function renderSummary(){
  let g=0,r=0,n=0;
  BREAKS.forEach(function(b){
    cfg.users.forEach(function(u){
      var s=day.st[b]?.[u.id];
      if(s===true)g++; else if(s===false)r++; else n++;
    });
  });
  document.getElementById('sum-g').textContent=g+' dabei';
  document.getElementById('sum-r').textContent=r+' nein';
  document.getElementById('sum-n').textContent=n+' offen';
}

function renderAll(){
  BREAKS.forEach(renderSection);
  renderSummary();
  var ne=document.getElementById('lunch-note');
  if(ne) ne.value=day.note||'';
}

/* ══════════════════════════════════════════
   SETTINGS DRAWER
══════════════════════════════════════════ */
function openSettings(){
  fillDrawer();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeSettings(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  document.body.style.overflow='';
  reconcile(); saveDay(); renderAll();
}

function fillDrawer(){
  var body=document.getElementById('drw-body');
  body.innerHTML='';

  /* ── Users ── */
  var usec=document.createElement('div');
  usec.className='dsec';
  usec.innerHTML='<div class="dsec-title">👤 Personen</div>';

  var ulist=document.createElement('div');
  ulist.style.cssText='display:flex;flex-direction:column;gap:8px';

  function drawUsers(){
    ulist.innerHTML='';
    cfg.users.forEach(function(u){
      var row=document.createElement('div');
      row.className='surow';
      row.innerHTML=
        '<div class="av" style="background:'+u.color+';width:32px;height:32px;border-radius:8px;font-size:.8rem">'+u.name[0].toUpperCase()+'</div>'+
        '<span class="suname">'+u.name+'</span>'+
        '<button class="del-btn" data-id="'+u.id+'">Entfernen</button>';
      row.querySelector('.del-btn').addEventListener('click',function(){
        if(cfg.users.length<=1){alert('Mindestens eine Person muss bleiben.');return;}
        cfg.users=cfg.users.filter(function(x){return x.id!==u.id;});
        saveCfg(); drawUsers();
      });
      ulist.appendChild(row);
    });
  }
  drawUsers();

  var addRow=document.createElement('div');
  addRow.className='add-row';
  addRow.innerHTML='<input class="add-inp" id="nusr" type="text" placeholder="Name eingeben …" maxlength="30"/><button class="add-btn">+ Hinzufügen</button>';

  var inp=addRow.querySelector('#nusr');
  var palette=['#6366f1','#f59e0b','#16a34a','#f43f8e','#06b6d4','#a855f7','#ef4444','#0ea5e9'];
  function doAdd(){
    var name=inp.value.trim(); if(!name)return;
    var id=name.toLowerCase().replace(/\s+/g,'_')+'_'+Date.now();
    cfg.users.push({id:id,name:name,color:palette[cfg.users.length%palette.length]});
    saveCfg(); inp.value=''; drawUsers();
  }
  addRow.querySelector('.add-btn').addEventListener('click',doAdd);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')doAdd();});

  usec.appendChild(ulist);
  usec.appendChild(addRow);
  body.appendChild(usec);

  /* ── Break times ── */
  var bsec=document.createElement('div');
  bsec.className='dsec';
  bsec.innerHTML='<div class="dsec-title">⏰ Pausenzeiten (15 min Schritte)</div>';

  var breakLabels={breakfast:'🥐 Frühstück',lunch:'🍜 Mittagessen'};
  BREAKS.forEach(function(brk){
    var bc=cfg.breaks[brk];
    var hours=[];for(var i=7;i<=20;i++)hours.push(i);
    var mins=[0,15,30,45];

    function hOpts(v){return hours.map(function(h){return '<option value="'+h+'"'+(h===v?' selected':'')+'>'+p2(h)+'</option>';}).join('');}
    function mOpts(v){return mins.map(function(m){return '<option value="'+m+'"'+(m===v?' selected':'')+'>'+p2(m)+'</option>';}).join('');}
    function dOpts(sl,dv){return sl.map(function(t){return '<option value="'+t+'"'+(t===dv?' selected':'')+'>'+t+'</option>';}).join('');}

    var curSl=slots(bc.sh,bc.sm,bc.eh,bc.em);
    var wrap=document.createElement('div');
    wrap.className='bset';
    wrap.innerHTML=
      '<div class="bset-lbl">'+breakLabels[brk]+'</div>'+
      '<div class="bset-row">'+
        '<span class="bset-sub">Von</span>'+
        '<select class="tsel" id="'+brk+'sh">'+hOpts(bc.sh)+'</select>'+
        '<select class="tsel" id="'+brk+'sm">'+mOpts(bc.sm)+'</select>'+
        '<span class="bset-sub">–</span>'+
        '<span class="bset-sub">Bis</span>'+
        '<select class="tsel" id="'+brk+'eh">'+hOpts(bc.eh)+'</select>'+
        '<select class="tsel" id="'+brk+'em">'+mOpts(bc.em)+'</select>'+
      '</div>'+
      '<div class="bset-row">'+
        '<span class="bset-sub">Standard:</span>'+
        '<select class="tsel" id="'+brk+'def">'+dOpts(curSl,bc.def)+'</select>'+
      '</div>';
    bsec.appendChild(wrap);

    // wire after insertion
    setTimeout(function(){
      function refresh(){
        cfg.breaks[brk].sh=+document.getElementById(brk+'sh').value;
        cfg.breaks[brk].sm=+document.getElementById(brk+'sm').value;
        cfg.breaks[brk].eh=+document.getElementById(brk+'eh').value;
        cfg.breaks[brk].em=+document.getElementById(brk+'em').value;
        var sl2=slots(cfg.breaks[brk].sh,cfg.breaks[brk].sm,cfg.breaks[brk].eh,cfg.breaks[brk].em);
        document.getElementById(brk+'def').innerHTML=dOpts(sl2,cfg.breaks[brk].def);
        saveCfg();
      }
      ['sh','sm','eh','em'].forEach(function(p){
        var el=document.getElementById(brk+p);
        if(el) el.addEventListener('change',refresh);
      });
      var de=document.getElementById(brk+'def');
      if(de) de.addEventListener('change',function(){cfg.breaks[brk].def=de.value;saveCfg();});
    },50);
  });

  body.appendChild(bsec);
}

/* ══════════════════════════════════════════
   BOOT
══════════════════════════════════════════ */
document.getElementById('hdr-date').textContent =
  new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});

loadAll();
reconcile();
renderAll();
</script>
